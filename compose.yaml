name: tracelens
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRACELENS_DB_URL: jdbc:postgresql://postgres:5432/tracelens?connectTimeout=2&socketTimeout=3&cancelSignalTimeout=1&options=-c%20statement_timeout%3D2000
      TRACELENS_DB_USERNAME: ${TRACELENS_DB_USERNAME:-tracelens}
      TRACELENS_DB_PASSWORD: ${TRACELENS_DB_PASSWORD:?Set a local password in .env}
      TRACELENS_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: tracelens
      POSTGRES_USER: ${TRACELENS_DB_USERNAME:-tracelens}
      POSTGRES_PASSWORD: ${TRACELENS_DB_PASSWORD:?Set a local password in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.6.1-alpine@sha256:2afba59292f25f5d1af200496db41bea2c6c816b059f57ae74703a50a03a27d0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
